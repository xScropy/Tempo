name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0). Created on this commit if it does not exist."
        required: true
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            files: src-tauri/target/release/bundle/nsis/*.exe
          - os: ubuntu-22.04
            bundles: deb
            files: |
              src-tauri/target/release/bundle/deb/*.deb
              server/dist/tempo-social-server.cjs
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - run: npm ci
      - run: npm test
      - if: runner.os == 'Linux'
        run: npm run build:server
      - run: npm run tauri build -- --bundles ${{ matrix.bundles }}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Tempo ${{ github.event.inputs.tag || github.ref_name }}
          prerelease: true
          files: ${{ matrix.files }}
          body: |
            Tempo — a local-first desktop app for tasks, projects, focus sessions, time tracking, calendar, habits, goals and reports.

            **Install (Windows):** download `Tempo_*_x64-setup.exe` and run it over your existing install; your data is kept. The installer is not code-signed, so Windows SmartScreen will warn; choose "More info" → "Run anyway".
            **Install (Debian/Ubuntu):** `sudo apt install ./Tempo_*_amd64.deb`

            **Friends on other networks:** Social → *Start a group*, send the code, friends choose *Join with a code*. No server needed; the group is reachable while the starter's Tempo is open. For an always-on group, run `node tempo-social-server.cjs` (Node 20+). See docs/SOCIAL.md.

            What changed is in CHANGELOG.md. This is a pre-release: installers are produced by CI. See ROADMAP.md for what is and is not built.
